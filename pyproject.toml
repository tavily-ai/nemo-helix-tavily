[project]
name = "nemo-helix-tavily-plugin"
version = "0.2.0"
description = "Tavily web search and extraction for NeMo Helix agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tavily by Nebius", email = "tavily-integrations@nebius.com" }]
keywords = ["nemo-helix", "tavily", "mcp", "web-search", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# NeMo Helix and its plugin SDK require Python 3.12+.
requires-python = ">=3.12,<3.15"
# Not nemo-helix, so NeMo Helix can depend on this plugin without a cycle.
dependencies = [
    "nemo-helix-plugin>=0.9",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tavily-ai/nemo-helix-tavily"
Source = "https://github.com/tavily-ai/nemo-helix-tavily"
Issues = "https://github.com/tavily-ai/nemo-helix-tavily/issues"
Changelog = "https://github.com/tavily-ai/nemo-helix-tavily/releases"

# Mounts the MCP proxy at /apis/tavily/v2/workspaces/{workspace}/mcp.
[project.entry-points."nemo.services"]
tavily = "nemo_tavily_plugin.service:TavilyService"

# `nemo tavily setup|enable|disable|status|search|extract`.
[project.entry-points."nemo.cli"]
tavily = "nemo_tavily_plugin.cli:TavilyCLI"

[project.entry-points."nemo.skills"]
tavily = "nemo_tavily_plugin.skills:get_skills_path"

[dependency-groups]
# The platform and `nemo` CLI, for running the plugin locally and for scripts/smoke.py.
helix = ["nemo-helix>=0.9"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
lint = ["ruff>=0.6", "ty"]

[tool.uv]
default-groups = ["helix", "test", "lint"]

[build-system]
# 1.27 writes the PEP 639 License-Expression and License-File metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_tavily_plugin"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

# Matches NeMo Helix's ruff settings, so code moves between the two repos unchanged.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W291", "W292", "W293", "I001", "I002"]
