# SPDX-License-Identifier: MIT

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  # The NeMo Helix API image the tests run in: the Python environment the plugin is installed into
  # in production. A nightly 0.9 build until NeMo Helix 0.9 is released; then pin the release.
  HELIX_IMAGE: ghcr.io/nvidia-nemo/nemo-helix/nhx-api:rc-20261028230653

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check
      - run: uvx ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Helix's images report their own packages as version 0.0.0, so a plain pip install would
      # try to replace them from PyPI to satisfy nemo-helix-plugin>=0.9. The image already has
      # every runtime dependency, so install the plugin without its dependencies.
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e PYTHONDONTWRITEBYTECODE=1 --entrypoint sh "$HELIX_IMAGE" -c '
            set -e
            /app/.venv/bin/pip install --no-cache-dir --no-deps .
            /app/.venv/bin/pip install --no-cache-dir pytest pytest-asyncio ty
            /app/.venv/bin/ty check --python /app/.venv
            /app/.venv/bin/python -m pytest -q -p no:cacheprovider'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the wheel has the skill and every entry point
        run: |
          unzip -l dist/*.whl | grep -q 'nemo_tavily_plugin/skills/nemo-tavily-web-search/SKILL.md'
          entry_points=$(unzip -p dist/*.whl '*.dist-info/entry_points.txt')
          for group in nemo.services nemo.cli nemo.skills; do
            grep -qF "[$group]" <<<"$entry_points" || { echo "::error::wheel has no [$group] entry point"; exit 1; }
          done
      # So that NeMo Helix can ship this plugin as one of its dependencies, the plugin must not
      # depend on nemo-helix (a cycle). The plugin SDK (nemo-helix-plugin) is the only NeMo
      # package it may require.
      - name: Check the wheel's license and dependency metadata
        run: |
          metadata=$(unzip -p dist/*.whl '*.dist-info/METADATA')
          grep -qx 'License-Expression: MIT' <<<"$metadata" || { echo "::error::wheel has no MIT License-Expression"; exit 1; }
          unzip -l dist/*.whl | grep -q '\.dist-info/licenses/LICENSE$' || { echo "::error::wheel has no LICENSE file"; exit 1; }
          if grep -qiE '^Requires-Dist: nemo[-_.]helix([^-_.a-z]|$)' <<<"$metadata"; then
            echo "::error::the plugin must not depend on nemo-helix; depend on nemo-helix-plugin instead"
            exit 1
          fi
