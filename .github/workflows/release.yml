# SPDX-License-Identifier: Apache-2.0

# On a vX.Y.Z tag: run CI, publish the wheel as a GitHub pre-release, install it from its
# public URL into a fresh NeMo Helix, and mark the release as latest only if that works.
# The wheel's URL is what NVIDIA's image build and users' Dockerfiles pin:
#   https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/nemo_tavily_plugin-X.Y.Z-py3-none-any.whl
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # A fresh NeMo Helix to verify the published wheel in. Keep it at the oldest supported release.
  HELIX_IMAGE: nvcr.io/nvidia/nemo-helix/nhx-api:0.9.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment so a release needs an approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      url: ${{ steps.release.outputs.url }}
      sha256: ${{ steps.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish as a pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="nemo_tavily_plugin-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$wheel"
          sha256=$(grep " $wheel\$" dist/SHA256SUMS | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Requires NeMo Helix 0.9 or later.

          Install into a NeMo Helix environment:

          \`\`\`bash
          pip install "$url#sha256=$sha256"
          \`\`\`

          Verify provenance: \`gh attestation verify $wheel --repo $GITHUB_REPOSITORY\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  verify:
    # Install from the public release URL, as NVIDIA and users will, into a fresh NeMo Helix.
    needs: publish
    runs-on: ubuntu-latest
    env:
      WHEEL: ${{ needs.publish.outputs.url }}#sha256=${{ needs.publish.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: CLI on a laptop, with NeMo Helix from PyPI
        run: |
          uv venv --python 3.12
          uv pip install "$WHEEL"
          .venv/bin/nemo tavily --help
      - name: Platform, inside the NeMo Helix API image
        run: |
          docker run --rm -e WHEEL -v "$PWD/scripts:/scripts:ro" --entrypoint sh "$HELIX_IMAGE" -c \
            '/app/.venv/bin/pip install --no-cache-dir "$WHEEL" && /app/.venv/bin/python /scripts/smoke.py'

  promote:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
